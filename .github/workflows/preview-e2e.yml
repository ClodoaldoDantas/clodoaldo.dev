name: Preview E2E

on:
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: read
  statuses: write

jobs:
  e2e:
    if: github.event.client_payload.environment == 'preview'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Use Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests against the Vercel Preview
        run: npm run cy:run
        env:
          CYPRESS_BASE_URL: ${{ github.event.client_payload.url }}

      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 3

      - name: Report E2E status on the deployed commit
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: E2E Preview
